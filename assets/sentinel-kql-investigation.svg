<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><linearGradient id="head" x2="1"><stop stop-color="#06172d"/><stop offset="1" stop-color="#154d7e"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17304e}.panel{fill:#fff;stroke:#d7e4f1;stroke-width:1.4}.muted{fill:#6b7f97;font-size:14px}.white{fill:#fff}.code{font-family:Consolas,monospace;font-size:17px;fill:#d8eaff}</style></defs><rect width="1440" height="900" fill="#edf3fa"/><rect width="1440" height="112" fill="url(#head)"/><circle cx="56" cy="56" r="28" fill="#157be5"/><path d="M39 55L56 36L73 55L56 76Z" fill="#e8f5ff"/><text x="100" y="49" class="white" font-size="29" font-weight="bold">Microsoft Sentinel — KQL Investigation</text><text x="100" y="79" fill="#bad9f7" font-size="16">Security analytics  /  Threat hunting  /  Log investigation</text><text x="1390" y="48" text-anchor="end" fill="#d7eaff" font-size="14">PORTFOLIO LAB • DEMO DATA</text><text x="1390" y="77" text-anchor="end" fill="#bad9f7" font-size="13">Example query and findings</text>
<rect x="32" y="136" width="845" height="398" rx="12" class="panel"/><text x="58" y="176" font-size="21" font-weight="bold">KQL query workspace</text><text x="58" y="201" class="muted">Illustrative query for reviewing endpoint alert records</text><rect x="58" y="220" width="793" height="252" rx="8" fill="#0a2039"/><text x="82" y="256" class="code"><tspan fill="#70c5ff">SecurityAlert</tspan></text><text x="82" y="286" class="code">| where TimeGenerated &gt; ago(7d)</text><text x="82" y="316" class="code">| where AlertSeverity in ("High", "Medium")</text><text x="82" y="346" class="code">| project TimeGenerated, AlertName, AlertSeverity,</text><text x="106" y="376" class="code">ProviderName, CompromisedEntity</text><text x="82" y="406" class="code">| order by TimeGenerated desc</text><text x="82" y="446" fill="#8aa8c9" font-family="Consolas,monospace" font-size="13">// Validate table and field names in your workspace.</text><rect x="58" y="489" width="160" height="30" rx="6" fill="#1677e8"/><text x="138" y="509" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Query example</text><text x="239" y="509" class="muted">Not executed against a live tenant</text>
