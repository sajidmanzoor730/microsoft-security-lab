<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#fff"/><text x="70" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Defender for Endpoint — Lab Evidence</text><text x="70" y="108" font-family="Arial" font-size="17" fill="#4b5563">Portfolio summary based on the user's Microsoft 365 E5 trial lab</text><rect x="70" y="165" width="330" height="180" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><text x="235" y="220" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#111827">10+</text><text x="235" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">alerts investigated</text><text x="235" y="295" text-anchor="middle" font-family="Arial" font-size="16" fill="#6b7280">malware / phishing scenarios</text><rect x="435" y="165" width="330" height="180" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><text x="600" y="220" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Alert Triage</text><text x="600" y="260" text-anchor="middle" font-family="Arial" font-size="17" fill="#374151">Severity • device • activity</text><text x="600" y="292" text-anchor="middle" font-family="Arial" font-size="17" fill="#374151">Evidence • investigation context</text><rect x="800" y="165" width="330" height="180" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><text x="965" y="220" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Outcome</text><text x="965" y="260" text-anchor="middle" font-family="Arial" font-size="17" fill="#374151">Prioritization</text><text x="965" y="292" text-anchor="middle" font-family="Arial" font-size="17" fill="#374151">Structured investigation</text><rect x="70" y="400" width="1060" height="190" rx="18" fill="#f9fafb" stroke="#111827" stroke-width="2"/><text x="100" y="445" font-family="Arial" font-size="22" font-weight="700" fill="#111827">What was practiced</text><text x="100" y="485" font-family="Arial" font-size="17" fill="#374151">• Reviewing alert context and severity</text><text x="100" y="518" font-family="Arial" font-size="17" fill="#374151">• Examining affected devices, activity, evidence and investigation context</text><text x="100" y="551" font-family="Arial" font-size="17" fill="#374151">• Prioritizing alerts for further investigation</text><text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7280">Illustrative portfolio evidence card — not a screenshot of Microsoft Defender.</text></svg>