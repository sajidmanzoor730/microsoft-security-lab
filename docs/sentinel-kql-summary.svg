<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#fff"/><text x="70" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Microsoft Sentinel — KQL Lab Evidence</text><text x="70" y="108" font-family="Arial" font-size="17" fill="#4b5563">Hands-on query practice completed during the Microsoft 365 E5 trial lab</text><rect x="70" y="160" width="310" height="170" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><text x="225" y="220" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#111827">5+</text><text x="225" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">KQL queries</text><text x="225" y="292" text-anchor="middle" font-family="Arial" font-size="15" fill="#6b7280">written and tested</text><rect x="425" y="160" width="705" height="400" rx="18" fill="#111827"/><text x="455" y="205" font-family="monospace" font-size="17" fill="#fff">SecurityAlert</text><text x="455" y="240" font-family="monospace" font-size="16" fill="#fff">| where TimeGenerated &gt; ago(7d)</text><text x="455" y="275" font-family="monospace" font-size="16" fill="#fff">| summarize AlertCount = count()</text><text x="455" y="310" font-family="monospace" font-size="16" fill="#fff">  by AlertSeverity</text><text x="455" y="345" font-family="monospace" font-size="16" fill="#fff">| order by AlertCount desc</text><text x="455" y="405" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Practiced analysis patterns</text><text x="455" y="440" font-family="Arial" font-size="16" fill="#fff">Filtering • summarization • severity analysis</text><text x="455" y="472" font-family="Arial" font-size="16" fill="#fff">High-severity review • entity-level analysis</text><text x="455" y="520" font-family="Arial" font-size="14" fill="#d1d5db">Portfolio visual — query example reflects the lab work.</text><text x="600" y="640" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7280">Illustrative portfolio evidence card — not a screenshot of Microsoft Sentinel.</text></svg>